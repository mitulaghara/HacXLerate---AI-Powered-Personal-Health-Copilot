<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#140f2d" />
      <stop offset="50%" stop-color="#080714" />
      <stop offset="100%" stop-color="#040308" />
    </radialGradient>
    <radialGradient id="cyanCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F5FF" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#8B5CF6" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    
    <!-- Neon Gradients -->
    <linearGradient id="neonCyanPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#FF00E5" />
    </linearGradient>
    <linearGradient id="wireGrid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="laserBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF" stop-opacity="0" />
      <stop offset="25%" stop-color="#00F5FF" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#00FF88" stop-opacity="1" />
      <stop offset="75%" stop-color="#FF00E5" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes floatGrid {
        0% { transform: translateY(0); }
        50% { transform: translateY(-8px); }
        100% { transform: translateY(0); }
      }
      @keyframes pulseBeam {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 1; }
      }
      @keyframes orbitRing {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .grid-lines { animation: floatGrid 6s ease-in-out infinite; }
      .laser { animation: pulseBeam 3s ease-in-out infinite; }
      .ring-rot { transform-origin: 750px 160px; animation: orbitRing 20s linear infinite; }
      .ring-rot-rev { transform-origin: 750px 160px; animation: orbitRing 14s linear infinite reverse; }
    </style>
  </defs>

  <!-- Deep Cosmic Canvas -->
  <rect width="900" height="320" fill="url(#bgGlow)" rx="16" />
  <rect width="900" height="320" fill="none" stroke="#8B5CF6" stroke-width="1.5" stroke-opacity="0.3" rx="16" />

  <!-- Background Ambience Glow -->
  <circle cx="450" cy="140" r="280" fill="url(#cyanCore)" />
  <circle cx="750" cy="160" r="140" fill="#8B5CF6" fill-opacity="0.08" />
  <circle cx="150" cy="160" r="140" fill="#00F5FF" fill-opacity="0.05" />

  <!-- 3D Perspective Cyber Grid (Floor) -->
  <g class="grid-lines" opacity="0.45">
    <line x1="50" y1="320" x2="350" y2="180" stroke="url(#wireGrid)" stroke-width="1" />
    <line x1="180" y1="320" x2="400" y2="180" stroke="url(#wireGrid)" stroke-width="1" />
    <line x1="320" y1="320" x2="450" y2="180" stroke="url(#wireGrid)" stroke-width="1" />
    <line x1="450" y1="320" x2="450" y2="180" stroke="url(#wireGrid)" stroke-width="1" />
    <line x1="580" y1="320" x2="450" y2="180" stroke="url(#wireGrid)" stroke-width="1" />
    <line x1="720" y1="320" x2="500" y2="180" stroke="url(#wireGrid)" stroke-width="1" />
    <line x1="850" y1="320" x2="550" y2="180" stroke="url(#wireGrid)" stroke-width="1" />
    
    <!-- Transverse Grid Latitudes -->
    <ellipse cx="450" cy="200" rx="380" ry="12" fill="none" stroke="#00F5FF" stroke-opacity="0.15" stroke-width="0.8" />
    <ellipse cx="450" cy="230" rx="420" ry="18" fill="none" stroke="#00F5FF" stroke-opacity="0.25" stroke-width="1" />
    <ellipse cx="450" cy="270" rx="460" ry="24" fill="none" stroke="#8B5CF6" stroke-opacity="0.35" stroke-width="1.2" />
  </g>

  <!-- Left Futuristic Holographic Hud Widget -->
  <g transform="translate(60, 45)" opacity="0.85">
    <rect x="0" y="0" width="130" height="24" rx="12" fill="#00F5FF" fill-opacity="0.1" stroke="#00F5FF" stroke-width="1" />
    <circle cx="12" cy="12" r="4" fill="#00FF88">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="24" y="16" fill="#00FF88" font-family="'Courier New', monospace" font-size="10" font-weight="bold" letter-spacing="1">v1.0.0 LIVE</text>
  </g>

  <g transform="translate(200, 45)" opacity="0.85">
    <rect x="0" y="0" width="160" height="24" rx="12" fill="#8B5CF6" fill-opacity="0.1" stroke="#8B5CF6" stroke-width="1" />
    <text x="14" y="16" fill="#C084FC" font-family="'Courier New', monospace" font-size="10" font-weight="bold" letter-spacing="1">SIH 2026 FINALIST</text>
  </g>

  <!-- Center Main Brand Text -->
  <g filter="url(#glow)">
    <text x="70" y="132" fill="url(#neonCyanPurple)" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="52" font-weight="900" letter-spacing="3">
      GRAMIN AROGYA
    </text>
  </g>
  <text x="70" y="132" fill="#FFFFFF" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="52" font-weight="900" letter-spacing="3">
    GRAMIN AROGYA
  </text>

  <!-- Subtitle Tagline -->
  <text x="72" y="166" fill="#00F5FF" font-family="'Courier New', monospace" font-size="14" font-weight="700" letter-spacing="2">
    &gt; NEXT-GEN RURAL HEALTH ACCESS &amp; CARE CONTINUITY PLATFORM
  </text>
  
  <text x="72" y="196" fill="#94A3B8" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="400">
    Voice AI Triage • Offline-First ASHA Queue • Smart Facility Routing • Emergency Blood Bank
  </text>

  <!-- Futuristic Metric Pills (Bottom Left) -->
  <g transform="translate(70, 226)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="140" height="34" rx="8" fill="#0A0B16" stroke="#00F5FF" stroke-width="1" stroke-opacity="0.6" />
    <text x="14" y="15" fill="#64748B" font-family="'Courier New', monospace" font-size="9" font-weight="bold">TIER ARCHITECTURE</text>
    <text x="14" y="27" fill="#00F5FF" font-family="'Inter', sans-serif" font-size="12" font-weight="800">4 Core Portals</text>

    <!-- Pill 2 -->
    <rect x="152" y="0" width="140" height="34" rx="8" fill="#0A0B16" stroke="#8B5CF6" stroke-width="1" stroke-opacity="0.6" />
    <text x="166" y="15" fill="#64748B" font-family="'Courier New', monospace" font-size="9" font-weight="bold">OFFLINE CAPABILITY</text>
    <text x="166" y="27" fill="#C084FC" font-family="'Inter', sans-serif" font-size="12" font-weight="800">100% Zero-Net Sync</text>

    <!-- Pill 3 -->
    <rect x="304" y="0" width="140" height="34" rx="8" fill="#0A0B16" stroke="#00FF88" stroke-width="1" stroke-opacity="0.6" />
    <text x="318" y="15" fill="#64748B" font-family="'Courier New', monospace" font-size="9" font-weight="bold">SECURITY VERIFICATION</text>
    <text x="318" y="27" fill="#00FF88" font-family="'Inter', sans-serif" font-size="12" font-weight="800">Realtime SMTP OTP</text>
  </g>

  <!-- Right Side: 3D Holographic Gyroscope Sphere -->
  <g transform="translate(0, 0)">
    <!-- Outer Orbit Ring -->
    <g class="ring-rot">
      <ellipse cx="750" cy="160" rx="86" ry="34" fill="none" stroke="#00F5FF" stroke-width="1.8" stroke-dasharray="6,4" filter="url(#subtleGlow)" />
      <circle cx="836" cy="160" r="4" fill="#00F5FF" filter="url(#subtleGlow)" />
    </g>

    <!-- Mid Orbit Ring (Angled) -->
    <g class="ring-rot-rev">
      <ellipse cx="750" cy="160" rx="38" ry="88" fill="none" stroke="#FF00E5" stroke-width="1.5" stroke-dasharray="4,6" filter="url(#subtleGlow)" />
      <circle cx="750" cy="72" r="3.5" fill="#FF00E5" filter="url(#subtleGlow)" />
    </g>

    <!-- Diagonal Ring -->
    <g class="ring-rot">
      <ellipse cx="750" cy="160" rx="76" ry="50" transform="rotate(45 750 160)" fill="none" stroke="#8B5CF6" stroke-width="1.4" stroke-opacity="0.8" />
    </g>

    <!-- Inner Glowing Core Sphere -->
    <circle cx="750" cy="160" r="38" fill="url(#cyanCore)" />
    <circle cx="750" cy="160" r="30" fill="#090818" stroke="#00FF88" stroke-width="1.2" stroke-opacity="0.8" />
    
    <!-- Crosshair / HUD Grid Inside Core -->
    <line x1="725" y1="160" x2="775" y2="160" stroke="#00FF88" stroke-width="1" stroke-opacity="0.7" />
    <line x1="750" y1="135" x2="750" y2="185" stroke="#00FF88" stroke-width="1" stroke-opacity="0.7" />
    <circle cx="750" cy="160" r="14" fill="none" stroke="#00F5FF" stroke-width="1" stroke-opacity="0.9" />
    <circle cx="750" cy="160" r="4" fill="#00FF88" />

    <!-- Radar Sweep Effect -->
    <g transform="rotate(0 750 160)">
      <animateTransform attributeName="transform" type="rotate" from="0 750 160" to="360 750 160" dur="4s" repeatCount="indefinite" />
      <line x1="750" y1="160" x2="750" y2="75" stroke="#00F5FF" stroke-width="1.5" stroke-opacity="0.6" stroke-linecap="round" />
    </g>

    <!-- Status Text Under Core -->
    <text x="750" y="270" text-anchor="middle" fill="#94A3B8" font-family="'Courier New', monospace" font-size="10" letter-spacing="1">
      NEURAL CARE HUB [ACTIVE]
    </text>
  </g>

  <!-- Bottom Laser Separator Line -->
  <line x1="0" y1="316" x2="900" y2="316" stroke="url(#laserBeam)" stroke-width="2.5" class="laser" />
</svg>
