<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TechYodhas - Standalone Loader</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="loader.css">
</head>
<body class="bg-slate-950 text-slate-100 antialiased font-sans overflow-hidden min-h-screen flex items-center justify-center p-4">

  <!-- Particle Background Canvas -->
  <canvas id="particleCanvas" class="absolute inset-0 z-0 pointer-events-auto"></canvas>
  <div class="absolute inset-0 grid-bg z-0 pointer-events-none"></div>

  <!-- Tech Scanner Line -->
  <div class="absolute inset-x-0 h-1 bg-gradient-to-r from-transparent via-cyan-400 to-transparent opacity-30 z-0 animate-[scanline_8s_linear_infinite]"></div>

  <!-- Standalone Loader UI Card -->
  <div class="relative z-10 max-w-md w-full text-center p-8 rounded-2xl bg-slate-900/80 backdrop-blur-xl border border-cyan-500/30 shadow-[0_0_50px_rgba(6,182,212,0.15)] float-box">
    
    <!-- Animated Spinner Ring -->
    <div class="relative w-20 h-20 mx-auto mb-6 flex items-center justify-center">
      <div class="absolute inset-0 rounded-full border-4 border-cyan-500/20 border-t-cyan-400 animate-spin"></div>
      <div class="absolute inset-2 rounded-full border-4 border-indigo-500/20 border-b-indigo-400 animate-[spin_1.5s_linear_infinite_reverse]"></div>
      <span class="w-3 h-3 rounded-full bg-cyan-400 animate-pulse"></span>
    </div>

    <!-- Status Header -->
    <h3 class="text-xs font-mono tracking-[0.3em] uppercase text-cyan-400 mb-1">System Initializing</h3>
    <h1 class="text-2xl font-extrabold tracking-wider uppercase bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 to-indigo-400 glow-title mb-4">
      TECH YODHAS
    </h1>

    <!-- Progress Bar -->
    <div class="w-full h-1.5 bg-slate-800 rounded-full overflow-hidden mb-4 border border-slate-700/50">
      <div id="progressBar" class="h-full bg-gradient-to-r from-cyan-500 via-sky-400 to-indigo-500 w-1/12 rounded-full transition-all duration-300"></div>
    </div>

    <div class="flex justify-between text-[10px] font-mono text-slate-400">
      <span id="loadStatus">Connecting to Network...</span>
      <span id="loadPercent">10%</span>
    </div>
  </div>

  <script src="loader.js"></script>
  <script>
    // Simulated Loading Sequence
    let progress = 10;
    const bar = document.getElementById('progressBar');
    const percent = document.getElementById('loadPercent');
    const status = document.getElementById('loadStatus');

    const statuses = [
      'Connecting to Network...',
      'Initializing TechYodhas Core...',
      'Loading AI Modules...',
      'Authenticating Squad...',
      'System Online!'
    ];

    const interval = setInterval(() => {
      progress += Math.floor(Math.random() * 15) + 5;
      if (progress >= 100) {
        progress = 100;
        clearInterval(interval);
        status.textContent = statuses[4];
        status.classList.add('text-emerald-400', 'font-bold');
      } else {
        const idx = Math.floor((progress / 100) * (statuses.length - 1));
        status.textContent = statuses[idx];
      }
      bar.style.width = progress + '%';
      percent.textContent = progress + '%';
    }, 400);
  </script>
</body>
</html>
