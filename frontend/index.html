<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/favicon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <title>GraminArogya | Rural Health Access & Care Continuity Platform</title>
  <meta name="description"
    content="AI-assisted Voice Triage, Offline-first ASHA Field Companion, Smart Healthcare Facility Routing, and Digital QR Continuity Hub for Rural India." />
  <!-- Google Fonts for Premium Modern Healthcare Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
    rel="stylesheet">
  <!-- Leaflet Map Stylesheet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

  <style>
    /* Clean up Google Translate DOM injections & banners */
    .goog-te-banner-frame.skiptranslate,
    .goog-te-banner-frame,
    #goog-gt-tt,
    .goog-te-balloon-frame {
      display: none !important;
    }
    body {
      top: 0px !important;
    }
    .goog-text-highlight {
      background: none !important;
      box-shadow: none !important;
    }
    #google_translate_element {
      display: none !important;
    }
    .skiptranslate:not(.goog-te-combo) {
      display: none !important;
    }
  </style>

  <script>
    // Safeguard React DOM reconciliation against external translation wrappers
    if (typeof Node === 'function' && Node.prototype) {
      const origRemoveChild = Node.prototype.removeChild;
      Node.prototype.removeChild = function (child) {
        if (child.parentNode !== this) {
          return child;
        }
        return origRemoveChild.apply(this, arguments);
      };

      const origInsertBefore = Node.prototype.insertBefore;
      Node.prototype.insertBefore = function (newNode, refNode) {
        if (refNode && refNode.parentNode !== this) {
          return newNode;
        }
        return origInsertBefore.apply(this, arguments);
      };
    }
  </script>
</head>

<body>
  <div id="google_translate_element" style="display:none;"></div>
  <div id="root"></div>

  <script type="text/javascript">
    function googleTranslateElementInit() {
      new google.translate.TranslateElement({
        pageLanguage: 'en',
        includedLanguages: 'en,hi,gu,mr,ta,te,bn',
        autoDisplay: false
      }, 'google_translate_element');
    }
  </script>
  <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
